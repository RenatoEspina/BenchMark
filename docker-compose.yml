services:
  vllm:
    image: vllm/vllm-openai:v0.24.0
    container_name: vllm
    ports:
      - "8000:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    cpuset: "0-11"
    command:
      - meta-llama/Llama-3.2-1B-Instruct
      - --gpu-memory-utilization
      - "0.70"
      - --max-model-len
      - "4092"
      - --enforce-eager
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    cpuset: "0-11"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  jlama:
    image: ${JLAMA_IMAGE:-jlama:local}
    container_name: jlama
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models
    cpuset: "0-11"
    command:
      - restapi
      - --auto-download
      - tjake/Llama-3.2-1B-Instruct-JQ4

volumes:
  ollama-data: