services:
  vllm:
    image: vllm/vllm-openai:v0.24.0
    container_name: vllm
    ports:
      - "8000:8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    cpuset: "0-11"
    ipc: host
    command:
      - meta-llama/Llama-3.2-1B-Instruct
      - --gpu-memory-utilization
      - "0.70"
      - --max-model-len
      - "2048"
      - --enforce-eager
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    cpuset: "0-11"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30

jlama:
  image: ${JLAMA_IMAGE:-jlama:0.8.4}
  container_name: jlama
  user: "${UID}:${GID}"
  ports:
    - "8080:8080"
  volumes:
    - ./models:/models
  cpuset: "0-11"
  environment:
    JLAMA_JVM_ARGS_EXTRA: "-Xmx4g"
  command:
    - restapi
    - tjake/Llama-3.2-1B-Instruct-JQ4
    - --auto-download
    - --model-cache
    - /models
    - --threads
    - "12"
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ui/index.html >/dev/null"]
    interval: 5s
    timeout: 3s
    retries: 120

volumes:
  ollama-data:
